components:
  schemas:
    AggregateMemberInput:
      properties:
        circuit_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Circuit Id
        device_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
        allocation_percent:
          anyOf:
          - type: number
            maximum: 100.0
            exclusiveMinimum: 0.0
          - type: string
          title: Allocation Percent
          default: '100'
      additionalProperties: false
      type: object
      title: AggregateMemberInput
    AggregateSetCreate:
      properties:
        site_id:
          type: string
          title: Site Id
        utility_account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Utility Account Id
        name:
          type: string
          maxLength: 160
          minLength: 1
          title: Name
        cost_scope:
          type: string
          enum:
          - energy_only
          - allocated_account
          - full_account
          title: Cost Scope
          default: energy_only
        is_default:
          type: boolean
          title: Is Default
          default: false
        confirm_overlap:
          type: boolean
          title: Confirm Overlap
          default: false
        members:
          items:
            $ref: '#/components/schemas/AggregateMemberInput'
          type: array
          minItems: 1
          title: Members
      additionalProperties: false
      type: object
      required:
      - site_id
      - name
      - members
      title: AggregateSetCreate
    AlertAcknowledge:
      properties:
        note:
          type: string
          maxLength: 500
          title: Note
          default: ''
      additionalProperties: false
      type: object
      title: AlertAcknowledge
    AlertRuleWrite:
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 1
          title: Name
        rule_type:
          type: string
          enum:
          - heartbeat_stale
          - device_api_unreachable
          - authentication_failure
          - protocol_incompatible
          - pzem_failure
          - no_valid_reading
          - sd_failure
          - sync_backlog
          - sequence_gap
          - time_untrusted
          - low_rssi
          - power_surge
          - ct_utilization
          - voltage_frequency_range
          - reboot_loop
          - firmware_failure
          - server_failure
          title: Rule Type
        severity:
          type: string
          enum:
          - info
          - warning
          - error
          - critical
          title: Severity
        enabled:
          type: boolean
          title: Enabled
          default: true
        site_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Id
        device_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
        debounce_seconds:
          type: integer
          maximum: 86400.0
          minimum: 0.0
          title: Debounce Seconds
          default: 0
        resolve_seconds:
          type: integer
          maximum: 86400.0
          minimum: 0.0
          title: Resolve Seconds
          default: 0
        configuration:
          additionalProperties: true
          type: object
          title: Configuration
      additionalProperties: false
      type: object
      required:
      - name
      - rule_type
      - severity
      title: AlertRuleWrite
    AlertSilence:
      properties:
        until:
          type: string
          format: date-time
          title: Until
        note:
          type: string
          maxLength: 500
          title: Note
          default: ''
      additionalProperties: false
