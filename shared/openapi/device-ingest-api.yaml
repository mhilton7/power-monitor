openapi: 3.1.0
info:
  title: Power Monitor Server device ingest API
  version: 1.0.0
  description: Device-to-server half of pm-protocol/1.0.0.
servers:
  - url: https://power-monitor.example.com
components:
  securitySchemes:
    pmHmac: {type: apiKey, in: header, name: X-PM-Signature}
  schemas:
    JsonObject: {type: object, additionalProperties: true}
    OtaManifestUnavailable:
      type: object
      required: [available, protocol_version]
      properties:
        available: {const: false}
        protocol_version: {const: pm-protocol/1.0.0}
      additionalProperties: false
    OtaManifestV2:
      type: object
      required: [schema_version, protocol_version, deployment_id, release_id, device_id, version, project_name, hardware_target, protocol_min, protocol_max, size_bytes, sha256, build_hash, not_before, expires_at, allow_downgrade, attempt, hmac_algorithm, hmac_key_context, download_path, manifest_hmac]
      properties:
        schema_version: {const: pm-ota-manifest/2}
        protocol_version: {const: pm-protocol/1.0.0}
        deployment_id: {type: string, format: uuid}
        release_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        version: {type: string}
        project_name: {const: power-monitor-sensor}
        hardware_target: {const: esp32-s3}
        protocol_min: {const: pm-protocol/1.0.0}
        protocol_max: {const: pm-protocol/1.0.0}
        size_bytes: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        build_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        not_before: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        allow_downgrade: {type: boolean}
        attempt: {type: integer, minimum: 1}
        hmac_algorithm: {const: HMAC-SHA256}
        hmac_key_context: {const: pm-ota-manifest-v2/server-to-device}
        download_path: {type: string}
        manifest_hmac: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      additionalProperties: false
    OtaDeploymentReportV2:
      type: object
      required: [device_id, deployment_id, release_id, attempt, state, current_firmware_version, current_build_hash, target_version, target_sha256, bytes_received, image_size, progress, boot_id, failure_code, failure_summary]
      properties:
        device_id: {type: string, format: uuid}
        deployment_id: {type: string, format: uuid}
        release_id: {type: string, format: uuid}
        attempt: {type: integer, minimum: 1}
        state: {type: string, enum: [manifest_authenticated, waiting_for_schedule, download_started, downloading, binary_verified, partition_written, rebooting, post_boot_validation, validated, failed, rollback_detected, rolled_back]}
        current_firmware_version: {type: string, minLength: 1, maxLength: 80}
        current_build_hash: {type: string, minLength: 1, maxLength: 128}
        target_version: {type: string, minLength: 1, maxLength: 80}
        target_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes_received: {type: integer, minimum: 0}
        image_size: {type: integer, minimum: 1}
        progress: {type: integer, minimum: 0, maximum: 100}
        boot_id: {type: string, format: uuid}
        evidence_sequence: {type: [integer, 'null'], minimum: 0, maximum: 18446744073709551615}
        failure_code: {type: [string, 'null']}
        failure_summary: {type: [string, 'null'], maxLength: 500}
      additionalProperties: false
paths:
  /api/v1/device-enrollment/claim:
    post:
      operationId: claimEnrollment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
      responses: {'201': {description: Permanent identity and one-time credential, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}}
  /api/v1/device-heartbeats:
    post:
      operationId: postHeartbeat
      security: [{pmHmac: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
      responses: {'200': {description: Server cursor and desired state, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}}
  /api/v1/device-readings/batch:
    post:
      operationId: postReadingBatch
      security: [{pmHmac: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
      responses: {'200': {description: Committed ingestion result, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}}
  /api/v1/device-events/batch:
    post:
      operationId: postEventBatch
      security: [{pmHmac: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
      responses: {'200': {description: Accepted event count, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}}
  /api/v1/device-config/effective:
    get: {operationId: getEffectiveConfig, security: [{pmHmac: []}], responses: {'200': {description: Desired configuration, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}}}
  /api/v1/device-config/report:
    post:
      operationId: reportConfig
      security: [{pmHmac: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
      responses: {'200': {description: Report recorded}}
  /api/v1/device-firmware/manifest:
    get:
      operationId: getFirmwareManifest
      security: [{pmHmac: []}]
      responses:
        '200':
          description: Device-specific authenticated release or exact unavailable sentinel
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/OtaManifestUnavailable'}
                  - {$ref: '#/components/schemas/OtaManifestV2'}
  /api/v1/device-firmware/report:
    post:
      operationId: reportFirmwareDeployment
      security: [{pmHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtaDeploymentReportV2'}
      responses:
        '200': {description: Idempotent milestone result}
  /api/v1/device-firmware/{release_id}/download:
    get:
      operationId: downloadFirmware
      security: [{pmHmac: []}]
      parameters:
        - {name: release_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: deployment_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Authorized immutable firmware stream
          headers:
            Digest: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /api/v1/time:
    get: {operationId: getTimeHint, responses: {'200': {description: Non-authoritative UTC hint, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}, '429': {description: Rate limited}}}
