openapi: 3.1.0
info:
  title: Power Monitor headless agent API
  version: 2.0.0
  description: Outbound-only ESP32-S3 agent transport. The agent exposes no runtime HTTP API.
  x-agent-protocol: pm-agent/2.0.0
  x-data-reset-protocol: data-reset/1.0.0
servers:
  - url: https://power-monitor.local
components:
  securitySchemes:
    pmAgentHmac:
      type: apiKey
      in: header
      name: X-PM-Signature
  schemas:
    AgentHeartbeat:
      type: object
      additionalProperties: false
      required: [protocol, device_id, boot_id, firmware_version, build_hash, uptime_ms, reset_reason, wifi, pzem, sd, sequences, reset_projection, capabilities, configuration_revision, reset_generation, reset_operation, resources, task_stack_margins, ota, time_trusted]
      properties:
        protocol: {const: pm-agent/2.0.0}
        device_id: {type: string, format: uuid}
        boot_id: {type: string, format: uuid}
        firmware_version: {type: string, minLength: 1, maxLength: 32}
        build_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        uptime_ms: {type: integer, minimum: 0, maximum: 9223372036854775807}
        reset_reason: {type: string, minLength: 1, maxLength: 64}
        wifi: {type: object}
        latest: {type: [object, 'null']}
        pzem: {type: object}
        sd: {type: object}
        sequences: {type: object}
        reset_projection: {type: object}
        capabilities: {type: object}
        configuration_revision: {type: integer, minimum: 0}
        reset_generation: {type: integer, minimum: 0}
        reset_operation: {type: object}
        resources: {type: object}
        task_stack_margins: {type: object}
        last_command_result: {type: [object, 'null']}
        ota: {type: object}
        time_trusted: {type: boolean}
    AgentCommand:
      type: object
      additionalProperties: false
      required: [command_id, device_id, type, created_at, expires_at, expected_current_state, payload, idempotency_key]
      properties:
        command_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        type:
          type: string
          enum: [apply_configuration, reboot, data_reset_prepare, data_reset_commit, data_reset_cancel, data_reset_status, ota_update, sync_now]
        created_at: {type: string, format: date-time, pattern: 'Z$'}
        expires_at: {type: string, format: date-time, pattern: 'Z$'}
        expected_current_state: {type: object}
        payload: {type: object}
        idempotency_key: {type: string, minLength: 8, maxLength: 160}
paths:
  /api/v2/agent/enroll:
    post:
      operationId: enrollHeadlessAgent
      responses:
        '201': {description: One-time enrollment completed}
  /api/v2/agent/heartbeat:
    post:
      operationId: postAgentHeartbeat
      security: [{pmAgentHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentHeartbeat'}
      responses:
        '200':
          description: Signed acknowledgement and at most one durable command
  /api/v2/agent/readings:
    post:
      operationId: postAgentReadings
      security: [{pmAgentHmac: []}]
      responses:
        '200': {description: Signed highest-contiguous durable acknowledgement}
  /api/v2/agent/events:
    post:
      operationId: postAgentEvents
      security: [{pmAgentHmac: []}]
      responses:
        '200': {description: Signed bounded event acknowledgement}
  /api/v2/agent/commands/results:
    post:
      operationId: postAgentCommandResult
      security: [{pmAgentHmac: []}]
      responses:
        '200': {description: Signed durable command-result acknowledgement}
  /api/v2/agent/firmware/{release_id}:
    get:
      operationId: downloadAgentFirmwareRange
      security: [{pmAgentHmac: []}]
      parameters:
        - {name: release_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Range, in: header, required: true, schema: {type: string, pattern: '^bytes=[0-9]+-[0-9]+$'}}
      responses:
        '206': {description: Authenticated bounded firmware range}
