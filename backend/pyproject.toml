[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power-monitor-server"
version = "1.0.0"
description = "Self-hosted multi-device power monitoring server"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "cryptography==49.0.0",
  "email-validator==2.2.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "orjson==3.11.9",
  "prometheus-client==0.22.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pyotp==2.9.0",
  "python-multipart==0.0.32",
  "starlette==1.3.1",
  "sqlalchemy[asyncio]==2.0.41",
  "structlog==25.4.0",
  "tzdata==2025.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "httpx==0.28.1",
  "mypy==1.17.0",
  "openapi-spec-validator==0.7.2",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
  "testcontainers[postgres]==4.10.0",
  "types-PyYAML==6.0.12.20250516",
  "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests", "../worker/tests", "../simulator/tests"]
pythonpath = [".", ".."]
markers = [
  "integration: requires PostgreSQL or a running service",
  "load: bounded load and resilience test",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "../worker", "../simulator", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"../simulator/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/"]
